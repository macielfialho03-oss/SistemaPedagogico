name: Verify
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test --configuration Release
      - run: node --check src/SistemaPedagogico.Web/wwwroot/js/educamais.js
      - run: python3 -m py_compile scripts/online-backup.py
